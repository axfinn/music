services:
  music:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MUSIC_IMAGE:-music}:${MUSIC_TAG:-latest}
    container_name: music
    ports:
      # 本地部署端口：宿主机 HOST_PORT → 容器内 8080（HOST_PORT 可在 .env 中改）
      - "${HOST_PORT:-8083}:8080"
    environment:
      # 覆盖 config.yaml 的环境变量示例
      - PORT=8080
      - DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Shanghai}
      # 可选的额外管理口令；留空则只用内置固定口令（后台始终可用）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # 站点身份 / 对外接口设置；留空时走 config.yaml 或内置默认值
      - SITE_NAME=${SITE_NAME:-}
      - SITE_TAGLINE=${SITE_TAGLINE:-}
      - SITE_DESCRIPTION=${SITE_DESCRIPTION:-}
      - SITE_BASE_URL=${SITE_BASE_URL:-}
      - API_KEY_RATE_LIMIT=${API_KEY_RATE_LIMIT:-}
      - API_ALLOW_ORIGINS=${API_ALLOW_ORIGINS:-}
      # 反爬 / 防批量拖库；留空走 config.yaml 或内置默认值
      - ANTI_CRAWL=${ANTI_CRAWL:-}
      - ANTI_CRAWL_READ_RATE=${ANTI_CRAWL_READ_RATE:-}
      - ANTI_CRAWL_BULK_RATE=${ANTI_CRAWL_BULK_RATE:-}
      - ANTI_CRAWL_STREAM_RATE=${ANTI_CRAWL_STREAM_RATE:-}
      - ANTI_CRAWL_BLOCK_UA=${ANTI_CRAWL_BLOCK_UA:-}
      - ANTI_CRAWL_ALLOW_UA=${ANTI_CRAWL_ALLOW_UA:-}
    volumes:
      - ./data:/app/data
      # 如需自定义配置，取消下一行注释并准备 config.yaml
      # - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
