services:
  music:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${MUSIC_IMAGE:-music}:${MUSIC_TAG:-latest}
    container_name: music
    ports:
      # 本地部署端口：宿主机 HOST_PORT → 容器内 8080（HOST_PORT 可在 .env 中改）
      - "${HOST_PORT:-8083}:8080"
    environment:
      # 覆盖 config.yaml 的环境变量示例
      - PORT=8080
      - DATA_DIR=/app/data
      - TZ=${TZ:-Asia/Shanghai}
      # 站内管理口令；留空=纯访客模式（只有音乐库能听，后台全关）
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ./data:/app/data
      # 如需自定义配置，取消下一行注释并准备 config.yaml
      # - ./config.yaml:/app/config.yaml
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
