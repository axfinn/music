# music 配置示例（github.com/axfinn/music）
# 复制为 config.yaml 并按需修改；未写出的项使用默认值。
# 优先级：环境变量 > config.yaml > 默认值。

server:
  host: "0.0.0.0"
  port: 8080

# 音频 / 封面 / SQLite 根目录（Docker 下挂持久卷）
data_dir: "./data"

# ── 站点身份 ──
# 前端启动后拉 /api/site 拿这些值，用来渲染顶栏、标题与分享卡片。
# base_url 只用于生成 canonical / og:url 等绝对链接，不参与路由与鉴权。
site:
  name: "music"
  tagline: "独立音乐站"
  description: "私人曲库与歌词档案：上传、流式播放、行级歌词检索与发现流。"
  base_url: "https://music.jaxiu.cn"

# 后台管理口令。
# 留空只是「不额外设这个口令」——内置固定口令仍能让后台随时可用。
# 想再加一道自己知道的口令，就写在这里（会参与会话密钥派生，改它会使旧会话失效）。
admin:
  password: ""                 # 可选的额外管理口令；留空=只用内置固定口令

# ── 邮箱会员（注册 / 登录 / 找回）──
# 会员与管理是两套身份：会员靠邮箱验证码注册登录，用于识别「你是谁」；
# 管理靠上面的 admin.password 进后台。会员拿不到后台权限。
# 只有 mail.client_id 与 mail.client_secret 都配置了，注册登录入口才会开放。
auth:
  enabled: true                # 总开关；false=关闭会员注册登录
  code_ttl_minutes: 10         # 验证码有效期（分钟）
  session_ttl_hours: 720       # 会员会话有效期（小时），默认 30 天
  code_rate_limit: 3           # 同一邮箱每分钟最多发几次验证码

# ── 发信服务（t.jaxiu.cn）──
# client_credentials 换取 token 后调用 /send。
# from 必须落在该业务的发件人白名单内，否则上游返回 403 from_not_allowed；
# 填写前请先用控制台确认白名单地址，配错会导致验证码发不出去。
mail:
  base_url: "https://t.jaxiu.cn/api/mail/v1"
  client_id: ""                # mt_xxx；强烈建议用环境变量 MAIL_CLIENT_ID 注入
  client_secret: ""            # 密钥；只走服务端，绝不下发前端（用 MAIL_CLIENT_SECRET 注入）
  from: "devtools@jaxiu.cn"    # 占位默认值，请改成白名单内的真实地址
  from_name: "music"
  timeout_seconds: 15
# 对应环境变量：AUTH_ENABLED / AUTH_CODE_TTL_MINUTES / AUTH_SESSION_TTL_HOURS /
# AUTH_CODE_RATE_LIMIT / MAIL_BASE_URL / MAIL_CLIENT_ID / MAIL_CLIENT_SECRET /
# MAIL_FROM / MAIL_FROM_NAME / MAIL_TIMEOUT_SECONDS

# ── 对外 /api/v1/* 公共设置 ──
# 音乐与歌词两套 v1 接口共用同一把密钥、同一套 CORS 白名单与限流额度。
api:
  key_rate_limit: 60           # 单密钥每分钟上限
  allow_origins: []            # 空 = 允许任意来源；收紧时写完整 Origin，例如：
                               #   ["https://music.jaxiu.cn", "https://app.example.com"]

# ── 反爬 / 防批量拖库 ──
# 私人曲库默认拒绝爬虫与脚本批量取数：robots.txt 全禁 + noindex 响应头 +
# 拦截脚本类 UA + 匿名读接口按 IP 分级限流。开关对 /api/v1/*（API Key 授权通道）
# 不生效：那是主动签发密钥允许的程序化访问，要停用请撤销密钥。
security:
  anti_crawl: true             # 总开关；false = 只保留 robots.txt / noindex 声明
  anonymous_read_rate: 180     # 普通匿名读：次/分钟/IP（列表、详情、统计等）
  bulk_read_rate: 40           # 全量/导出类：次/分钟/IP（snapshot、full=1、export）
  stream_rate: 300             # 音频与封面：次/分钟/IP（Range 请求较频繁，单独放宽）
  block_user_agents: []        # 追加要拦的 UA 片段，如 ["my-scanner"]
  allow_user_agents: []        # 例外白名单（优先于黑名单），如 ["my-monitor/1.0"]
  # 完全放行的自家域名（含子域）：跳过反爬全部检查，CORS 也自动放行。
  # 留空 = 从 site.base_url 派生主域（music.jaxiu.cn → jaxiu.cn）。
  trusted_domains: []          # 如 ["jaxiu.cn", "other.example.com"]
# 对应环境变量：ANTI_CRAWL / ANTI_CRAWL_READ_RATE / ANTI_CRAWL_BULK_RATE /
# ANTI_CRAWL_STREAM_RATE / ANTI_CRAWL_BLOCK_UA / ANTI_CRAWL_ALLOW_UA /
# ANTI_CRAWL_TRUSTED_DOMAINS

music:
  audio_max_bytes: 209715200   # 单曲上限 200MB
  cover_max_bytes: 15728640    # 封面上限 15MB

# ── 歌词库 ──
lyrics:
  python_bin: ""               # 留空自动探测 python3
  script_path: ""              # 留空自动探测 scripts/lyrics_finder.py
  timeout_seconds: 45
  max_concurrent: 3

  # 旧版本的 api_key_rate_limit / allow_origins 若写在这里仍会自动迁移到 api 段，
  # 升级不需要改配置；新配置请直接写上面的 api。

  # ── 歌词发现 ──
  # 在线候选池：后台定时抓一批"你可能还没收录"的歌，与本地内容混在发现流里。
  discovery_seeds: []            # 种子歌单（"歌名 - 艺人"）；留空=用内置默认列表
  discovery_pool_size: 24        # 候选池上限
  discovery_batch_size: 4        # 每次刷新抓几首
  discovery_refresh_minutes: 30  # 池刷新间隔（分钟）
