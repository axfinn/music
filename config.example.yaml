# music-lyrics-archive 配置示例
# 复制为 config.yaml 并按需修改；未写出的项使用默认值。

server:
  host: "0.0.0.0"
  port: 8080

# 音频 / 封面 / SQLite 根目录（Docker 下挂持久卷）
data_dir: "./data"

music:
  audio_max_bytes: 209715200   # 单曲上限 200MB
  cover_max_bytes: 15728640    # 封面上限 15MB

lyrics:
  admin_password: ""           # 留空=禁用「签发/撤销 API 密钥」等站内管理动作
  python_bin: ""               # 留空自动探测 python3
  script_path: ""              # 留空自动探测 scripts/lyrics_finder.py
  timeout_seconds: 45
  max_concurrent: 3
  api_key_rate_limit: 60       # 单密钥每分钟上限
  allow_origins: []            # 对外 v1 接口 CORS 白名单；空=允许任意来源
