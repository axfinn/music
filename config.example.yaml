# music 配置示例（github.com/axfinn/music）
# 复制为 config.yaml 并按需修改；未写出的项使用默认值。
# 优先级：环境变量 > config.yaml > 默认值。

server:
  host: "0.0.0.0"
  port: 8080

# 音频 / 封面 / SQLite 根目录（Docker 下挂持久卷）
data_dir: "./data"

# ── 站点身份 ──
# 前端启动后拉 /api/site 拿这些值，用来渲染顶栏、标题与分享卡片。
# base_url 只用于生成 canonical / og:url 等绝对链接，不参与路由与鉴权。
site:
  name: "music"
  tagline: "独立音乐站"
  description: "私人曲库与歌词档案：上传、流式播放、行级歌词检索与发现流。"
  base_url: "https://music.jaxiu.cn"

# 后台管理口令。
# 留空只是「不额外设这个口令」——内置固定口令仍能让后台随时可用。
# 想再加一道自己知道的口令，就写在这里（会参与会话密钥派生，改它会使旧会话失效）。
admin:
  password: ""                 # 可选的额外管理口令；留空=只用内置固定口令

# ── 对外 /api/v1/* 公共设置 ──
# 音乐与歌词两套 v1 接口共用同一把密钥、同一套 CORS 白名单与限流额度。
api:
  key_rate_limit: 60           # 单密钥每分钟上限
  allow_origins: []            # 空 = 允许任意来源；收紧时写完整 Origin，例如：
                               #   ["https://music.jaxiu.cn", "https://app.example.com"]

music:
  audio_max_bytes: 209715200   # 单曲上限 200MB
  cover_max_bytes: 15728640    # 封面上限 15MB

# ── 歌词库 ──
lyrics:
  python_bin: ""               # 留空自动探测 python3
  script_path: ""              # 留空自动探测 scripts/lyrics_finder.py
  timeout_seconds: 45
  max_concurrent: 3

  # 旧版本的 api_key_rate_limit / allow_origins 若写在这里仍会自动迁移到 api 段，
  # 升级不需要改配置；新配置请直接写上面的 api。

  # ── 歌词发现 ──
  # 在线候选池：后台定时抓一批"你可能还没收录"的歌，与本地内容混在发现流里。
  discovery_seeds: []            # 种子歌单（"歌名 - 艺人"）；留空=用内置默认列表
  discovery_pool_size: 24        # 候选池上限
  discovery_batch_size: 4        # 每次刷新抓几首
  discovery_refresh_minutes: 30  # 池刷新间隔（分钟）
